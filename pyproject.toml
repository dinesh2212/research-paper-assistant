[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-paper-assistant"
version = "0.1.0"
description = "A local, citation-grounded research paper assistant."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.41",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/research_paper_assistant"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "backend.tests.*"
disallow_untyped_decorators = false
